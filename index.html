<!DOCTYPE html>
<html>
<head>
    <title>Cat vs Mouse</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="ui-layer">
    <div id="lobby">
        <h2 id="room-code">Room Code: Loading...</h2>
        <button onclick="selectRole('cat')">Play as Tom 🐱</button>
        <button onclick="selectRole('mouse')">Play as Jerry 🐭</button>
        <button id="start-btn" disabled onclick="startGame()">Start Game</button>
    </div>
    <div id="timer" style="display:none;">Time: 120</div>
</div>

<div id="game-wrapper">
    <div id="game"></div>
</div>

<div id="dpad" style="display:none;">
    <div id="dpad-inner">
        <button id="btn-up">▲</button>
        <div id="dpad-middle">
            <button id="btn-left">◀</button>
            <div id="dpad-center"></div>
            <button id="btn-right">▶</button>
        </div>
        <button id="btn-down">▼</button>
    </div>
</div>

<script src="game.js"></script>
</body>
</html>
