<!DOCTYPE html>
<html>
<head>
    <title>Cat vs Mouse</title>
    <!-- Socket.io served from same server, no hardcoded URL needed -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="ui-layer">
    <div id="lobby">
        <h2 id="room-code">Room Code: Loading...</h2>
        <button onclick="selectRole('cat')">Play as Tom</button>
        <button onclick="selectRole('mouse')">Play as Jerry</button>
        <button id="start-btn" disabled onclick="startGame()">Start Game</button>
    </div>
    <div id="timer" style="display:none;">Time: 120</div>
</div>
<div id="game"></div>

<script src="game.js"></script>
</body>
</html>
